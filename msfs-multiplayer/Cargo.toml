[package]
name = "msfs-multiplayer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Experimental multiplayer state relay and SimConnect injector"
license = "MIT"

[dependencies]
msfs-replay = { path = "../msfs-replay", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
msfs-sync = { path = "../msfs-sync", version = "0.1.0" }
