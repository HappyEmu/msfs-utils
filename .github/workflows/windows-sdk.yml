name: Windows SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sdk:
    runs-on: [self-hosted, windows, msfs-sdk]
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned msfs-rs dependency
        shell: pwsh
        run: |
          git clone https://github.com/flybywiresim/msfs-rs checkouts/msfs-rs
          git -C checkouts/msfs-rs checkout 2f697b9aac9fa3c00474f901a7f7ee4218cf534b
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
